[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-bench"
version = "1.0.0"
description = "Argo-Bench: agents doing operations work on a simulated food-delivery company's warehouse"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  # The harness: Inspect AI at the version the paper's runs used, and its MCP client.
  "inspect-ai==0.3.263",
  "mcp>=2.0,<3",
  "anthropic",
  "openai",
  "google-genai",
  "python-dotenv>=1.0",
  # The warehouse server.
  "pyarrow>=18",
  "duckdb>=1.3",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.30"]
# run_python's libraries for the local sandbox (unpinned; the Docker image pins them).
analysis = ["pandas", "numpy", "polars", "scipy", "statsmodels", "scikit-learn",
            "matplotlib", "seaborn", "ortools", "pulp", "sympy", "tabulate", "pyarrow"]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["argo_bench*"]

[tool.setuptools.package-data]
argo_bench = ["system_prompt.md", "sandbox/Dockerfile", "sandbox/local.sb",
              "sandbox/requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
